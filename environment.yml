name: domain_sd
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # Core ML
    - torch>=2.2.0
    - torchvision
    - torchaudio
    - transformers>=4.41.0
    - accelerate>=0.30.0
    - datasets>=2.19.0
    - tokenizers>=0.19.0
    - sentencepiece>=0.1.99
    - einops>=0.7.0

    # Config & experiment tracking
    - hydra-core>=1.3.0
    - omegaconf>=2.3.0
    - mlflow>=2.13.0

    # Visualization
    - matplotlib>=3.7.0
    - seaborn>=0.13.0

    # Data
    - numpy>=1.24.0
    - pandas>=2.0.0
    - scikit-learn>=1.3.0

    # S3 / cloud
    - boto3>=1.34.0

    # Utilities
    - tqdm>=4.66.0
    - python-dotenv>=1.0.0
    - pyyaml>=6.0

    # GPU inference (require Linux + CUDA)
    # Install manually on GPU server:
    #   pip install vllm>=0.4.0
    #   pip install deepspeed>=0.14.0
