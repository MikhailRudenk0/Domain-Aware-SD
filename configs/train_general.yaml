# Hydra config for the GENERAL drafter: one Lite-Mistral-150M trained on the
# union of all 66 Flan clusters. Serves as the baseline that domain-specific
# drafters must beat on per-cluster acceptance rate.
#
# Run from the project root:
#     python src/train_drafter.py --config-name=train_general
#
# IMPORTANT: all paths must be relative to the project root.

model:
  path: Lite-Mistral-150M-v2-Instruct
  dtype: bfloat16          # bfloat16 | float16 | float32
  trust_remote_code: false

data:
  synthetic_dir: data/synthetic/v1
  clusters_json: configs/clusters/all.json
  max_length: 512
  max_gen_length: 256
  min_top1_prob: null
  val_fraction: 0.05
  seed: 42

training:
  loss:
    mode: distillation
    ce_weight: 0.5
    temperature: 1.0

  output_dir: outputs/drafter_general
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 20
  eval_steps: 500
  save_steps: 500
  save_total_limit: 3
  bf16: true
  fp16: false
  gradient_checkpointing: false
  dataloader_num_workers: 2
  seed: 42

mlflow:
  tracking_uri: ./mlruns
  experiment_name: drafter_training
  run_name: drafter_general_all_clusters
