# Per-cluster drafter: wmt16_translate_ruen (single cluster, 30k samples)
# 10 epochs max, early stopping on eval_loss plateau/rise.
#
# Run from the project root:
#     CUDA_VISIBLE_DEVICES=0 python scripts/train_domain_drafter.py --config-name=train_wmt16_translate_ruen

model:
  path: Lite-Mistral-150M-v2-Instruct
  dtype: bfloat16
  trust_remote_code: false

data:
  synthetic_dir: data/synthetic/train/v3
  clusters_json: configs/clusters/wmt16_translate_ruen.json
  max_length: 512
  max_gen_length: 256
  min_top1_prob: null
  val_fraction: 0.05
  seed: 42

training:
  loss:
    mode: mixed
    ce_weight: 0.5
    temperature: 1.0

  output_dir: /media/public/rudenko/projects/Domain-Aware-SD/outputs/drafter_wmt16_translate_ruen
  num_train_epochs: 10
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  eval_steps: 500
  save_steps: 500
  save_total_limit: 4
  bf16: true
  fp16: false
  gradient_checkpointing: false
  dataloader_num_workers: 0
  seed: 42

mlflow:
  tracking_uri: ./mlruns
  experiment_name: domain_drafters
  run_name: drafter_wmt16_translate_ruen_10ep
