# Hydra config for evaluation pipeline.
# Run from the project root: python src/eval/main.py
#
# All paths are relative to the project root.

draft_models:
  # Each entry is a directory name. Resolution order:
  #   1. PROJECT_ROOT/<name>  (local)
  #   2. s3://<s3.bucket>/<s3.models_prefix>/<name>/  (download then use local)
  #   3. error
  - Lite-Mistral-150M-v2-Instruct

target:
  path: TurboSparse-Mistral-Instruct
  trust_remote_code: true

s3:
  bucket: domain-aware-sd
  models_prefix: models

datasets:
  # Each entry is either a file (*.jsonl / *.npz) or a directory. Directory
  # entries are recursively expanded into all *.jsonl and *.npz files inside.
  # Examples:
  #   - data/validation/v1/aeslc_10templates.jsonl
  #   - data/validation/v1                       # all clusters in that dir
  - data/validation/v1

# "dataset" — use top-K from the synthetic dataset (cheap, K = whatever was
# captured during generation, typically 10).
# "model"   — load the target locally and run teacher-forcing inference to get
# the full target distribution at every position.
target_source: dataset

# Number of trunk positions to evaluate per sample.
n_positions: 50

batch_size: 4
max_samples_per_file: null    # null = use all samples

# Inference is done with HuggingFace transformers (no vLLM here — vLLM is used
# only by the data-generation pipeline). On Mac use device=mps + dtype=float16
# for the local-test workflow; bfloat16 is silently downgraded to float16 on MPS.
device: mps                   # cuda | cpu | mps
dtype: float16                # bfloat16 | float16 | float32

# Metrics to compute (any subset). overlap_area is the canonical proxy for
# the SD acceptance rate (overlap_area == 1 - TVD == E[accept] under perfect
# speculative decoding).
metrics:
  - overlap_area
  - top1_match
  - topk_overlap
  - kl

# Aggregation strategies. Applied only when len(draft_models) > 1; otherwise
# the single result row is written under the "single" prefix and these are
# ignored.
aggregations:
  - best
  - arithmetic_average
  - geometric_average
  - softmax_sum
  - softmax_hadamard
  - most_confident

# K used by topk_overlap in full-target mode. In dataset mode K is taken from
# whatever the dataset provides per position.
topk_K: 10

output:
  dir: eval_results

mlflow:
  tracking_uri: ./mlruns
  experiment_name: eval_drafters
  run_name: null              # auto-generated from models + dataset
