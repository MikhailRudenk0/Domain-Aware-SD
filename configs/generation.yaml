# Hydra config for synthetic data generation
# Run from the project root: python src/generate_synthetic_data.py
#
# IMPORTANT: all paths must be relative to the project root.
# Never use absolute paths here — this config is committed to git and
# must work on any machine without modification.

model:
  path: TurboSparse-Mistral-Instruct
  trust_remote_code: true
  dtype: bfloat16
  # vLLM tensor parallelism (number of GPUs)
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90

data:
  flan_dir: flan
  split: train
  # Max samples to process per cluster (null = all)
  max_samples_per_cluster: 500
  # Shuffle before sampling
  shuffle: true
  shuffle_seed: 42

generation:
  # Top-k for logprobs capture (1 trunk + k-1 alternatives).
  # Set to 0 (or null) to disable top-K capture entirely — "normal mode".
  # In normal mode only the trunk token IDs are saved; useful for plain LM
  # fine-tuning where the distillation signal is not needed.
  logprobs: 10
  # Skip top-K capture at positions where top-1 prob exceeds this threshold.
  # 1.0 (default) → never skip; e.g. 0.95 → drop top-K wherever the target
  # is already very confident. Saves space, no signal loss for the drafter
  # at "easy" positions. Skipped positions are still recorded (as empty
  # entries), so trunk/labels stay aligned.
  skip_top10_above_prob: 1.0
  # Generation params
  max_new_tokens: 256
  temperature: 1.0
  top_p: 0.95
  # Stop on EOS
  stop_on_eos: true
  # Batch size for vLLM
  batch_size: 32

output:
  dir: data/synthetic
  version: v1
  # Storage format:
  #   jsonl — human-readable JSON Lines (recommended for validation/test splits)
  #   npz   — compact binary numpy archive (recommended for train split)
  # Both formats are read transparently by SpecDecDataset.
  format: jsonl

s3:
  bucket: domain-aware-sd
  prefix: data/synthetic
  upload_after_generation: false

mlflow:
  experiment_name: synthetic_data_generation
  tracking_uri: ./mlruns
